<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <meta name="theme-color" content="#121212">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AHSS Live Bracket</title>

  <style>
    :root{
      --bg:#121212;
      --panel:#0f0f10;
      --panel2:#141415;
      --border:#2d2f33;
      --text:#f0f0f0;
      --muted:#a7abcc;
      --teamA:#d32f2f;
      --teamB:#1976d2;
      --good:#3ddc84;
      --warn:#f2c94c;
      --bad:#ff5252;
      --accent:#00bcd4;
      --radius:14px;
      --shadow:0 14px 40px rgba(0,0,0,.45);
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:Arial, sans-serif;
      overflow:hidden;
      touch-action:manipulation;
    }

    .page{
      height:100vh;
      display:flex;
      flex-direction:column;
      padding:12px;
      gap:12px;
    }

    .topbar{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:10px 12px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:280px;
    }

    .brand img{
      max-width:120px;
      height:auto;
      display:block;
    }

    .brand h1{
      margin:0;
      font-size:18px;
      letter-spacing:.3px;
      color:#00eaff;
    }

    .brand .sub{
      margin:2px 0 0;
      color:rgba(255,255,255,.65);
      font-size:13px;
    }

    .toolbar{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:8px;
      flex-wrap:wrap;
    }

    .pill{
      padding:6px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
      font-size:12px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      white-space:nowrap;
    }

    .btn{
      border:none;
      border-radius:12px;
      padding:9px 11px;
      cursor:pointer;
      font-weight:900;
      font-size:12px;
      letter-spacing:.2px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      background:#1f1f1f;
      color:#fff;
      border:1px solid rgba(255,255,255,.14);
      user-select:none;
    }

    .btn:hover{
      opacity:.92;
    }

    .btn-primary{
      background:linear-gradient(90deg, var(--teamA), #ffffff, var(--teamB));
      color:#000;
      border:none;
    }

    .toolbarToggle input{
      width:auto;
      margin:0;
      accent-color:var(--accent);
    }

    .viewer{
      flex:1 1 auto;
      min-height:0;
      overflow:auto;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.18);
      padding:10px;
      scrollbar-width:auto;
      scrollbar-color:#00bcd4 #111;
    }

    .viewer::-webkit-scrollbar{
      width:16px;
      height:16px;
    }

    .viewer::-webkit-scrollbar-track{
      background:#111;
      border-radius:999px;
    }

    .viewer::-webkit-scrollbar-thumb{
      background:#00bcd4;
      border-radius:999px;
      border:3px solid #111;
    }

    .viewer::-webkit-scrollbar-corner{
      background:#111;
    }

    .zoomStage{
      transform-origin:top left;
      display:inline-block;
      min-width:max-content;
      min-height:max-content;
    }

    .emptyState{
      max-width:760px;
      margin:90px auto 0;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:18px;
      padding:24px;
      text-align:center;
      box-shadow:var(--shadow);
    }

    .emptyState h2{
      color:#00eaff;
      margin:0 0 8px;
      font-size:22px;
    }

    .emptyState p{
      color:rgba(255,255,255,.72);
      line-height:1.45;
      margin:8px 0;
    }

    .mini{
      font-size:12px;
      color:rgba(255,255,255,.68);
    }

    .bracket{
      min-width:5600px;
      display:block;
      padding:18px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background:
        linear-gradient(90deg, rgba(255,90,90,.10), rgba(0,0,0,.08) 33%, rgba(61,220,132,.08) 66%, rgba(0,188,212,.08)),
        rgba(0,0,0,.18);
      position:relative;
    }

    .bracketConnectorLayer{
      position:absolute;
      top:0;
      left:0;
      pointer-events:none;
      overflow:visible;
      z-index:2;
    }

    .pathLegend,
    .chartHeader,
    .chartColumnTitle,
    .chartPlaceholder,
    .match{
      position:relative;
      z-index:3;
    }

    .pathLegend{
      margin:0 0 10px;
      color:rgba(255,255,255,.72);
      font-size:11px;
      letter-spacing:.2px;
    }

    .bracketConnector{
      fill:none;
      stroke-width:2.25;
      vector-effect:non-scaling-stroke;
      stroke-linecap:round;
      stroke-linejoin:round;
      opacity:.82;
    }

    .bracketConnector.winnerPath{
      stroke:#3ddc84;
    }

    .bracketConnector.loserPath{
      stroke:#a56cff;
    }

    .bracketConnector.dropPath{
      stroke:#a56cff;
      stroke-dasharray:7 6;
    }

    .bracketConnector.finalsPath{
      stroke:#00eaff;
      stroke-dasharray:8 6;
    }

    .match.connectorTarget{
      border-color:rgba(0,234,255,.32);
    }

    .chartHeader{
      display:grid;
      grid-template-columns:1fr 1fr 280px;
      gap:18px;
      margin-bottom:10px;
    }

    .chartHeaderBox{
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.045);
      border-radius:14px;
      padding:10px 12px;
      font-size:12px;
      letter-spacing:.4px;
      text-transform:uppercase;
      color:rgba(255,255,255,.78);
      font-weight:900;
      display:flex;
      justify-content:space-between;
      gap:8px;
    }

    .chartHeaderBox .sub{
      font-size:11px;
      text-transform:none;
      letter-spacing:0;
      color:rgba(255,255,255,.48);
    }

    .chartBody{
      display:grid;
      grid-template-columns:1fr 1fr 280px;
      gap:18px;
      align-items:start;
    }

    .chartLane{
      border:1px solid rgba(255,255,255,.10);
      border-radius:18px;
      background:rgba(0,0,0,.13);
      min-height:360px;
      padding:14px;
      overflow:visible;
    }

    .chartLane.losersLane{
      background:linear-gradient(90deg, rgba(255,90,90,.08), rgba(0,0,0,.12));
    }

    .chartLane.winnersLane{
      background:linear-gradient(90deg, rgba(0,0,0,.12), rgba(61,220,132,.08));
    }

    .chartLane.finalsLane{
      background:linear-gradient(90deg, rgba(0,188,212,.07), rgba(255,213,79,.06));
    }

    .chartColumns{
      display:flex;
      gap:18px;
      align-items:flex-start;
      overflow:visible;
    }

    .chartColumns.reverseFlow{
      flex-direction:row-reverse;
    }

    .chartColumn{
      min-width:240px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .chartColumnTitle{
      font-size:12px;
      color:rgba(255,255,255,.72);
      letter-spacing:.4px;
      text-transform:uppercase;
      margin:0 0 2px 4px;
      display:flex;
      align-items:center;
      gap:6px;
      white-space:nowrap;
    }

    .flowArrow{
      color:rgba(0,234,255,.75);
      font-size:14px;
    }

    .flowNote{
      font-size:11px;
      color:rgba(255,255,255,.48);
      text-transform:none;
      letter-spacing:0;
    }

    .match{
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.12);
      border-radius:14px;
      padding:10px;
    }

    .match.complete{
      border-color:rgba(61,220,132,.38);
    }

    .match.ready{
      border-color:rgba(0,234,255,.9);
      box-shadow:0 0 0 2px rgba(0,234,255,.12), 0 0 28px rgba(0,234,255,.12);
    }

    .match.pending{
      opacity:.75;
    }

    .match-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
      color:rgba(255,255,255,.75);
      font-size:12px;
    }

    .match-head .tag{
      padding:4px 8px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      font-weight:800;
      color:#fff;
      font-size:11px;
      letter-spacing:.2px;
    }

    .callLabel{
      font-weight:1000;
    }

    .callLabel.ready{
      color:var(--good);
    }

    .callLabel.pending{
      color:var(--muted);
    }

    .statusText{
      margin-top:5px;
      text-align:right;
      font-size:11px;
      font-weight:900;
    }

    .statusText.complete{
      color:var(--good);
    }

    .statusText.ready{
      color:#00eaff;
    }

    .statusText.pending{
      color:rgba(255,255,255,.48);
    }

    .slot{
      display:grid;
      grid-template-columns:minmax(0, 1fr) minmax(88px, auto);
      gap:10px;
      align-items:center;
      margin-bottom:8px;
      padding:8px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.20);
    }

    .slot:last-child{
      margin-bottom:0;
    }

    .slot.win{
      border-color:rgba(61,220,132,.55);
      box-shadow:0 0 0 1px rgba(61,220,132,.18) inset;
    }

    .slot.lose{
      opacity:.78;
      border-color:rgba(255,255,255,.08);
    }

    .name{
      font-weight:900;
      font-size:13px;
      line-height:1.1;
      word-break:break-word;
    }

    .name.clickablePlayer{
      cursor:pointer;
      color:#fff;
      text-decoration:underline;
      text-decoration-color:rgba(0,234,255,.45);
      text-underline-offset:3px;
    }

    .name.clickablePlayer:hover{
      color:#00eaff;
    }

    .match.untrackedMatch{
      opacity:.14;
      filter:saturate(.3);
    }

    .match.trackedMatch{
      opacity:1;
      filter:none;
      border-color:#ffd54f;
      box-shadow:0 0 0 2px rgba(255,213,79,.28), 0 0 28px rgba(255,213,79,.18);
    }

    .slot.trackedPlayerSlot{
      border-color:#ffd54f;
      background:rgba(255,213,79,.11);
    }

    .bracketConnector.untrackedConnector{
      opacity:.07;
    }

    .bracketConnector.trackedConnector{
      stroke:#ffd54f;
      stroke-width:4;
      opacity:1;
    }

    .seed{
      font-size:11px;
      color:rgba(255,255,255,.55);
      margin-top:2px;
    }

    .scoreBox{
      width:100%;
      min-width:88px;
      max-width:118px;
      text-align:center;
      padding:8px 8px;
      border-radius:10px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
      font-weight:900;
      font-size:18px;
      line-height:1.1;
      outline:none;
      font-variant-numeric:tabular-nums;
      overflow:visible;
      white-space:nowrap;
    }

    .chartPlaceholder{
      border:1px dashed rgba(255,255,255,.14);
      background:rgba(0,0,0,.18);
      border-radius:14px;
      padding:14px;
      color:rgba(255,255,255,.56);
      font-size:12px;
      text-align:center;
      min-width:210px;
    }

    .footer{
      flex:0 0 auto;
      text-align:center;
      color:rgba(255,255,255,.45);
      font-size:12px;
      padding:2px 0 0;
    }

    @media (max-width:720px){
      .page{
        padding:8px;
      }

      .brand img{
        max-width:92px;
      }

      .brand h1{
        font-size:16px;
      }

      .brand .sub{
        font-size:12px;
      }

      .slot{
        grid-template-columns:minmax(0, 1fr) minmax(76px, auto);
      }

      .scoreBox{
        min-width:76px;
        max-width:104px;
        font-size:16px;
        padding:8px 6px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <img id="appLogo" src="logo.png" alt="AHSS Logo" />
        <div>
          <h1>Live Bracket</h1>
          <div class="sub" id="subtitle">Read only tournament snapshot</div>
        </div>
      </div>

      <div class="toolbar">
        <span class="pill" id="snapshotInfo">Loading snapshot...</span>
        <span class="pill" id="refreshInfo">Refresh: 20s</span>
        <span class="pill" id="playerFocusInfo">Player focus: none</span>
        <label class="pill toolbarToggle">
          <input type="checkbox" id="chkAutoRefresh" checked>
          Auto Refresh
        </label>
        <button class="btn" id="btnZoomOut" type="button">Zoom Out</button>
        <button class="btn" id="btnZoomIn" type="button">Zoom In</button>
        <button class="btn" id="btnClearPlayer" type="button">Clear Player</button>
        <button class="btn btn-primary" id="btnFocusActive" type="button">Focus Active</button>
        <button class="btn btn-primary" id="btnFit" type="button">Fit Width</button>
        <button class="btn btn-primary" id="btnRefresh" type="button">Refresh</button>
      </div>
    </div>

    <div class="viewer" id="viewer">
      <div class="zoomStage" id="zoomStage">
        <div id="bracketRoot"></div>
      </div>
    </div>

    <div class="footer">
      brackets.html read only live view
    </div>
  </div>

  <script>
    const STATE_KEY = "ahss_brackets_state";
    const REFRESH_MS = 20000;
    const ZOOM_KEY = "AHSS_LIVE_BRACKET_ZOOM";
    const AUTO_REFRESH_KEY = "AHSS_LIVE_AUTO_REFRESH";
    const TRACKED_PLAYER_KEY = "AHSS_LIVE_TRACKED_PLAYER";

    let liveZoom = 1;
    let refreshTimer = null;
    let shouldAutoFocus = true;
    let liveBracketState = null;
    let connectorFrame = 0;
    let connectorResizeObserver = null;
    let selectedPlayer = localStorage.getItem(TRACKED_PLAYER_KEY) || "";

    const $ = (sel, root=document) => root.querySelector(sel);

    function esc(s){
      return String(s ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;");
    }

    function fmtLocal(ts){
      if(!ts) return "";

      try{
        return new Date(ts).toLocaleString();
      }catch{
        return String(ts);
      }
    }

    function isRealBracketName(name){
      return !!name && name !== "TBD" && name !== "BYE";
    }

    function normalizePlayerName(name){
      return String(name || "").trim().replace(/\s+/g, " ").toLowerCase();
    }

    function autoRefreshEnabled(){
      return localStorage.getItem(AUTO_REFRESH_KEY) !== "0";
    }

    function matchCallLabel(m){
      return m && m.callNumber ? `Match ${m.callNumber}` : "Match Pending";
    }

    function isMatchVisibleOnChart(m){
      if(!m) return false;
      if(m.winner) return true;
      return isRealBracketName(m.p1) || isRealBracketName(m.p2);
    }

    function roundHasVisibleMatch(round){
      return (round || []).some(isMatchVisibleOnChart);
    }

    function visibleWindowForRounds(rounds){
      if(!rounds || !rounds.length) return [];

      return rounds.map((round, idx) => ({
        round,
        idx,
        isFuture: !roundHasVisibleMatch(round)
      }));
    }

    function shouldShowFinals(state){
      const gf = state && state.grandFinal ? state.grandFinal : [];

      if(gf.some(isMatchVisibleOnChart)){
        return true;
      }

      const winnersLast =
        state.winnersRounds &&
        state.winnersRounds[state.winnersRounds.length - 1]
          ? state.winnersRounds[state.winnersRounds.length - 1][0]
          : null;

      const losersLastRound =
        state.losersRounds &&
        state.losersRounds[state.losersRounds.length - 1]
          ? state.losersRounds[state.losersRounds.length - 1]
          : [];

      const losersLast = losersLastRound.length ? losersLastRound[losersLastRound.length - 1] : null;

      return !!(winnersLast && winnersLast.winner) || !!(losersLast && losersLast.winner);
    }

    function loadBracketState(){
      try{
        const raw = localStorage.getItem(STATE_KEY);

        if(!raw){
          return null;
        }

        const state = JSON.parse(raw);

        if(!state || !state.winnersRounds){
          return null;
        }

        return state;
      }catch(e){
        console.warn("Unable to load bracket state:", e);
        return null;
      }
    }

    function countMatches(state){
      let total = 0;

      (state.winnersRounds || []).forEach(round => total += round.length);
      (state.losersRounds || []).forEach(round => total += round.length);
      (state.grandFinal || []).forEach(() => total += 1);

      return total;
    }

    function getMatchStatus(m){
      if(!m) return "pending";
      if(m.winner) return "complete";
      if(isRealBracketName(m.p1) && isRealBracketName(m.p2)) return "ready";
      return "pending";
    }

    function getStatusText(status){
      if(status === "complete") return "Complete";
      if(status === "ready") return "Ready";
      return "Pending";
    }

    function renderSlot(match, lane, which){
      const slot = document.createElement("div");
      slot.className = "slot";
      slot.dataset.bracketSlot = which;

      if(match.winner === which){
        slot.classList.add("win");
      }

      if(match.winner && match.winner !== which){
        slot.classList.add("lose");
      }

      const rawName = (which === "p1" ? match.p1 : match.p2) || "TBD";
      const otherName = (which === "p1" ? match.p2 : match.p1) || "TBD";
      const waitingBye = rawName === "TBD" && isRealBracketName(otherName);
      const displayName = waitingBye ? "BYE" : rawName;
      const score = which === "p1" ? (match.s1 ?? "") : (match.s2 ?? "");
      const id = match.id || "";
      const playerClass = isRealBracketName(rawName) ? " clickablePlayer" : "";
      const playerAttribute = isRealBracketName(rawName) ? ` data-player="${esc(rawName)}"` : "";

      slot.dataset.playerName = normalizePlayerName(rawName);

      slot.innerHTML = `
        <div>
          <div class="name${playerClass}"${playerAttribute}>${esc(displayName)}</div>
          <div class="seed">${esc(id)} ${which.toUpperCase()}</div>
        </div>
        <div class="scoreBox">${esc(score)}</div>
      `;

      return slot;
    }

    function renderMatchCard(match, lane){
      const card = document.createElement("div");
      const status = getMatchStatus(match);

      card.className = `match ${status}`;
      card.dataset.status = status;
      card.dataset.matchId = match.id || "";
      card.dataset.lane = lane;
      card.dataset.matchKey = `${lane}|${match.id || ""}`;
      card.dataset.player1 = normalizePlayerName(match.p1);
      card.dataset.player2 = normalizePlayerName(match.p2);

      const tagText = lane === "W" ? "W" : lane === "L" ? "L" : "GF";

      const routeLabel = match.goldenCrossoverLabel
        ? ` <span class="mini" style="color:#00eaff;">${esc(match.goldenCrossoverLabel)}</span>`
        : "";

      const callLabel = matchCallLabel(match);
      const callClass = match.callNumber ? "ready" : "pending";

      card.innerHTML = `
        <div class="match-head">
          <div>
            <div class="callLabel ${callClass}">${esc(callLabel)}</div>
            <div>${esc(match.label || match.id || "")}${routeLabel}</div>
          </div>
          <div>
            <div class="tag">${tagText}</div>
            <div class="statusText ${status}">${esc(getStatusText(status))}</div>
          </div>
        </div>
      `;

      card.appendChild(renderSlot(match, lane, "p1"));
      card.appendChild(renderSlot(match, lane, "p2"));

      return card;
    }

    function buildUnifiedRoundColumn(round, idx, lane, isFuture=false){
      const col = document.createElement("div");
      col.className = "chartColumn";

      const laneName = lane === "W" ? "Winners" : "Losers";
      const arrow = lane === "W" ? "→" : (isFuture ? "…" : "←");
      const note = isFuture ? "next" : (lane === "W" ? "right" : "left");

      col.innerHTML = `
        <div class="chartColumnTitle">
          ${esc(laneName)} R${esc(idx + 1)}
          <span class="flowArrow">${esc(arrow)}</span>
          <span class="flowNote">${esc(note)}</span>
        </div>
      `;

      if(isFuture){
        col.innerHTML += `<div class="chartPlaceholder">Waiting for feeder match or BYE.</div>`;
        return col;
      }

      round.forEach(m => {
        if(isMatchVisibleOnChart(m)){
          col.appendChild(renderMatchCard(m, lane));
        }
      });

      return col;
    }

    function buildBracketChart(state){
      const bracketEl = document.createElement("div");
      bracketEl.className = "bracket";

      const connectorSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      connectorSvg.classList.add("bracketConnectorLayer");
      connectorSvg.setAttribute("aria-hidden", "true");

      const losersVisible = visibleWindowForRounds(state.losersRounds || []);
      const winnersVisible = visibleWindowForRounds(state.winnersRounds || []);
      const finalsVisible = shouldShowFinals(state);

      bracketEl.innerHTML = `
        <div class="pathLegend">Green: winners · Purple: losers · Dashed purple: winners-to-losers drop · Dashed cyan: finals</div>
        <div class="chartHeader">
          <div class="chartHeaderBox">
            <span>Losers Side</span>
            <span class="sub">flows left</span>
          </div>
          <div class="chartHeaderBox">
            <span>Winners Side</span>
            <span class="sub">flows right</span>
          </div>
          <div class="chartHeaderBox">
            <span>Finals</span>
            <span class="sub">reconnects</span>
          </div>
        </div>
      `;

      const body = document.createElement("div");
      body.className = "chartBody";

      const losersLane = document.createElement("div");
      losersLane.className = "chartLane losersLane";

      const losersCols = document.createElement("div");
      losersCols.className = "chartColumns reverseFlow";

      if(losersVisible.length){
        losersVisible.forEach(item => {
          losersCols.appendChild(buildUnifiedRoundColumn(item.round, item.idx, "L", item.isFuture));
        });
      }else{
        losersCols.innerHTML = `<div class="chartPlaceholder">Losers side appears when a player drops from winners.</div>`;
      }

      losersLane.appendChild(losersCols);

      const winnersLane = document.createElement("div");
      winnersLane.className = "chartLane winnersLane";

      const winnersCols = document.createElement("div");
      winnersCols.className = "chartColumns";

      if(winnersVisible.length){
        winnersVisible.forEach(item => {
          winnersCols.appendChild(buildUnifiedRoundColumn(item.round, item.idx, "W", item.isFuture));
        });
      }else{
        winnersCols.innerHTML = `<div class="chartPlaceholder">No active winners matches yet.</div>`;
      }

      winnersLane.appendChild(winnersCols);

      const finalsLane = document.createElement("div");
      finalsLane.className = "chartLane finalsLane";

      const finalsCols = document.createElement("div");
      finalsCols.className = "chartColumns";

      const gfCol = document.createElement("div");
      gfCol.className = "chartColumn";
      gfCol.innerHTML = `<div class="chartColumnTitle">Grand Final <span class="flowArrow">★</span></div>`;

      if(finalsVisible){
        (state.grandFinal || []).forEach(m => {
          if(isMatchVisibleOnChart(m)){
            gfCol.appendChild(renderMatchCard(m, "GF"));
          }
        });
      }else{
        gfCol.innerHTML += `<div class="chartPlaceholder">Grand Final appears when the winners champ and losers champ are ready.</div>`;
      }

      finalsCols.appendChild(gfCol);
      finalsLane.appendChild(finalsCols);

      body.appendChild(losersLane);
      body.appendChild(winnersLane);
      body.appendChild(finalsLane);

      bracketEl.appendChild(body);
      bracketEl.appendChild(connectorSvg);

      return bracketEl;
    }

    function applyPlayerPathHighlight(scrollToPlayer=false){
      const normalized = normalizePlayerName(selectedPlayer);
      const cards = Array.from(document.querySelectorAll("#bracketRoot .match"));
      const paths = Array.from(document.querySelectorAll("#bracketRoot .bracketConnector"));
      const status = $("#playerFocusInfo");

      if(!normalized){
        cards.forEach(card => card.classList.remove("trackedMatch", "untrackedMatch"));
        document.querySelectorAll("#bracketRoot .slot.trackedPlayerSlot").forEach(slot => {
          slot.classList.remove("trackedPlayerSlot");
        });
        paths.forEach(path => path.classList.remove("trackedConnector", "untrackedConnector"));
        if(status) status.textContent = "Player focus: none";
        return;
      }

      const trackedKeys = new Set();
      const trackedCards = [];

      cards.forEach(card => {
        const containsPlayer = card.dataset.player1 === normalized || card.dataset.player2 === normalized;
        card.classList.toggle("trackedMatch", containsPlayer);
        card.classList.toggle("untrackedMatch", !containsPlayer);

        card.querySelectorAll(".slot").forEach(slot => {
          slot.classList.toggle("trackedPlayerSlot", slot.dataset.playerName === normalized);
        });

        if(containsPlayer){
          trackedCards.push(card);
          trackedKeys.add(card.dataset.matchKey || "");
        }
      });

      if(!trackedCards.length){
        selectedPlayer = "";
        localStorage.removeItem(TRACKED_PLAYER_KEY);
        applyPlayerPathHighlight(false);
        return;
      }

      paths.forEach(path => {
        const isPlayerPath =
          trackedKeys.has(path.dataset.sourceMatch || "") &&
          trackedKeys.has(path.dataset.targetMatch || "");

        path.classList.toggle("trackedConnector", isPlayerPath);
        path.classList.toggle("untrackedConnector", !isPlayerPath);
      });

      if(status) status.textContent = `Player focus: ${selectedPlayer}`;

      if(scrollToPlayer){
        const target =
          trackedCards.find(card => card.classList.contains("ready")) ||
          trackedCards.find(card => !card.classList.contains("complete")) ||
          trackedCards[trackedCards.length - 1];

        if(target){
          target.scrollIntoView({ behavior:"smooth", block:"center", inline:"center" });
        }
      }
    }

    function selectPlayerPath(playerName){
      const clean = String(playerName || "").trim();

      if(normalizePlayerName(selectedPlayer) === normalizePlayerName(clean)){
        selectedPlayer = "";
        localStorage.removeItem(TRACKED_PLAYER_KEY);
      }else{
        selectedPlayer = clean;
        localStorage.setItem(TRACKED_PLAYER_KEY, selectedPlayer);
        shouldAutoFocus = false;
      }

      applyPlayerPathHighlight(!!selectedPlayer);
    }

    function clearPlayerPath(){
      selectedPlayer = "";
      localStorage.removeItem(TRACKED_PLAYER_KEY);
      applyPlayerPathHighlight(false);
    }

    function getConnectorRoutes(state){
      if(!state || !state.feeds) return [];

      const unique = new Map();

      Object.entries(state.feeds).forEach(([key, feed]) => {
        if(!feed) return;

        const parts = key.split("|");
        const sourceLane = parts[0] || "";
        const sourceId = parts[1] || "";
        const routes = Array.isArray(feed.paths) && feed.paths.length ? feed.paths : [feed];

        routes.forEach(target => {
          if(!sourceLane || !sourceId || !target || !target.lane || !target.id) return;

          const routeKey = `${sourceLane}|${sourceId}|${target.lane}|${target.id}|${target.which || ""}`;

          if(!unique.has(routeKey)){
            unique.set(routeKey, {
              sourceLane,
              sourceId,
              targetLane:target.lane,
              targetId:target.id,
              targetWhich:target.which || ""
            });
          }
        });
      });

      return Array.from(unique.values());
    }

    function getConnectorClass(route){
      if(route.sourceLane === "GF" || route.targetLane === "GF") return "finalsPath";
      if(route.sourceLane === "W" && route.targetLane === "L") return "dropPath";
      if(route.sourceLane === "L") return "loserPath";
      return "winnerPath";
    }

    function drawBracketConnectors(){
      connectorFrame = 0;

      const bracketEl = $("#bracketRoot .bracket");
      if(!bracketEl || !liveBracketState) return;

      const svg = bracketEl.querySelector(":scope > .bracketConnectorLayer");
      if(!svg) return;

      const bracketRect = bracketEl.getBoundingClientRect();
      const offsetWidth = bracketEl.offsetWidth;
      const offsetHeight = bracketEl.offsetHeight;

      if(!bracketRect.width || !bracketRect.height || !offsetWidth || !offsetHeight) return;

      const width = Math.max(bracketEl.scrollWidth, offsetWidth, 1);
      const height = Math.max(bracketEl.scrollHeight, offsetHeight, 1);
      const scaleX = bracketRect.width / offsetWidth;
      const scaleY = bracketRect.height / offsetHeight;

      svg.replaceChildren();
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("width", String(width));
      svg.setAttribute("height", String(height));
      svg.style.width = `${width}px`;
      svg.style.height = `${height}px`;

      bracketEl.querySelectorAll(".match.connectorTarget").forEach(card => {
        card.classList.remove("connectorTarget");
      });

      const toLocalBox = element => {
        const rect = element.getBoundingClientRect();
        const left = (rect.left - bracketRect.left) / scaleX;
        const top = (rect.top - bracketRect.top) / scaleY;
        const boxWidth = rect.width / scaleX;
        const boxHeight = rect.height / scaleY;

        return {
          left,
          top,
          right:left + boxWidth,
          bottom:top + boxHeight,
          centerX:left + boxWidth / 2,
          centerY:top + boxHeight / 2
        };
      };

      getConnectorRoutes(liveBracketState).forEach(route => {
        const sourceKey = `${route.sourceLane}|${route.sourceId}`;
        const targetKey = `${route.targetLane}|${route.targetId}`;
        const sourceCard = bracketEl.querySelector(`.match[data-match-key="${CSS.escape(sourceKey)}"]`);
        const targetCard = bracketEl.querySelector(`.match[data-match-key="${CSS.escape(targetKey)}"]`);

        if(!sourceCard || !targetCard || sourceCard === targetCard) return;

        const targetSlot = route.targetWhich
          ? targetCard.querySelector(`.slot[data-bracket-slot="${CSS.escape(route.targetWhich)}"]`)
          : null;
        const sourceBox = toLocalBox(sourceCard);
        const targetBox = toLocalBox(targetSlot || targetCard);

        let startX;
        let startY = sourceBox.centerY;
        let endX;
        let endY = targetBox.centerY;
        let d;

        if(Math.abs(targetBox.centerX - sourceBox.centerX) < 12){
          const movingDown = targetBox.centerY >= sourceBox.centerY;
          startX = sourceBox.centerX;
          endX = targetBox.centerX;
          startY = movingDown ? sourceBox.bottom : sourceBox.top;
          endY = movingDown ? targetBox.top : targetBox.bottom;
          const bend = Math.max(32, Math.min(90, Math.abs(endY - startY) * .45));
          d = `M ${startX} ${startY} C ${startX} ${startY + (movingDown ? bend : -bend)}, ${endX} ${endY + (movingDown ? -bend : bend)}, ${endX} ${endY}`;
        }else{
          const movingRight = targetBox.centerX > sourceBox.centerX;
          startX = movingRight ? sourceBox.right : sourceBox.left;
          endX = movingRight ? targetBox.left : targetBox.right;
          const distance = Math.abs(endX - startX);
          const bend = Math.max(42, Math.min(220, distance * .45));
          d = `M ${startX} ${startY} C ${startX + (movingRight ? bend : -bend)} ${startY}, ${endX + (movingRight ? -bend : bend)} ${endY}, ${endX} ${endY}`;
        }

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("class", `bracketConnector ${getConnectorClass(route)}`);
        path.dataset.sourceMatch = sourceKey;
        path.dataset.targetMatch = targetKey;
        svg.appendChild(path);
        targetCard.classList.add("connectorTarget");
      });

      applyPlayerPathHighlight(false);
    }

    function scheduleConnectorRedraw(){
      if(connectorFrame) cancelAnimationFrame(connectorFrame);

      connectorFrame = requestAnimationFrame(() => {
        connectorFrame = requestAnimationFrame(drawBracketConnectors);
      });
    }

    function wireConnectorRedraw(){
      window.addEventListener("resize", scheduleConnectorRedraw, { passive:true });

      if("ResizeObserver" in window){
        connectorResizeObserver = new ResizeObserver(scheduleConnectorRedraw);

        const root = $("#bracketRoot");
        const viewer = $("#viewer");

        if(root) connectorResizeObserver.observe(root);
        if(viewer) connectorResizeObserver.observe(viewer);
      }

      if(document.fonts && document.fonts.ready){
        document.fonts.ready.then(scheduleConnectorRedraw).catch(()=>{});
      }
    }

    function renderEmptyState(){
      const root = $("#bracketRoot");
      liveBracketState = null;

      root.innerHTML = `
        <div class="emptyState">
          <h2>No bracket snapshot found</h2>
          <p>
            Open Tournament Director in this same browser, build or load a bracket,
            then come back to this page.
          </p>
          <p class="mini">
            This page is read only and uses the saved local bracket snapshot.
          </p>
        </div>
      `;

      $("#snapshotInfo").textContent = "No snapshot";
      $("#subtitle").textContent = "Waiting for Tournament Director bracket data";
    }

    function renderLiveBracket(options = {}){
      const root = $("#bracketRoot");
      const state = loadBracketState();

      if(!state){
        renderEmptyState();
        $("#refreshInfo").textContent = autoRefreshEnabled()
          ? `Last check: ${new Date().toLocaleTimeString()}`
          : `Auto refresh off · checked ${new Date().toLocaleTimeString()}`;
        return;
      }

      const viewer = $("#viewer");
      const oldLeft = viewer.scrollLeft;
      const oldTop = viewer.scrollTop;

      liveBracketState = state;
      root.innerHTML = "";
      root.appendChild(buildBracketChart(state));
      applyPlayerPathHighlight(false);
      scheduleConnectorRedraw();

      const entrants = Array.isArray(state.entrants) ? state.entrants.length : 0;
      const size = state.bracketSize || "";
      const matches = countMatches(state);

      $("#snapshotInfo").textContent = `${entrants} entrants | Size ${size} | ${matches} matches`;
      $("#refreshInfo").textContent = autoRefreshEnabled()
        ? `Last refresh: ${new Date().toLocaleTimeString()}`
        : `Auto refresh off · refreshed ${new Date().toLocaleTimeString()}`;
      $("#subtitle").textContent = state.createdAt ? `Snapshot created ${fmtLocal(state.createdAt)}` : "Read only tournament snapshot";

      if((options.focusActive || shouldAutoFocus) && !selectedPlayer){
        setTimeout(focusActiveBracket, 80);
      }else{
        requestAnimationFrame(() => {
          viewer.scrollLeft = oldLeft;
          viewer.scrollTop = oldTop;
        });
      }
    }

    function setZoomPercent(pct, keepCenter=true){
      const viewer = $("#viewer");
      const stage = $("#zoomStage");

      if(!viewer || !stage) return;

      const oldZoom = liveZoom;
      const nextZoom = Math.max(0.25, Math.min(2.5, pct / 100));

      let centerX = 0;
      let centerY = 0;

      if(keepCenter && oldZoom > 0){
        centerX = (viewer.scrollLeft + viewer.clientWidth / 2) / oldZoom;
        centerY = (viewer.scrollTop + viewer.clientHeight / 2) / oldZoom;
      }

      liveZoom = nextZoom;
      stage.style.transform = `scale(${liveZoom})`;
      localStorage.setItem(ZOOM_KEY, String(Math.round(liveZoom * 100)));

      requestAnimationFrame(() => {
        if(keepCenter){
          viewer.scrollLeft = Math.max(0, centerX * liveZoom - viewer.clientWidth / 2);
          viewer.scrollTop = Math.max(0, centerY * liveZoom - viewer.clientHeight / 2);
        }
        scheduleConnectorRedraw();
      });
    }

    function zoomIn(){
      shouldAutoFocus = false;
      setZoomPercent((liveZoom * 100) + 10);
    }

    function zoomOut(){
      shouldAutoFocus = false;
      setZoomPercent((liveZoom * 100) - 10);
    }

    function fitWidth(){
      shouldAutoFocus = false;

      const viewer = $("#viewer");
      const stage = $("#zoomStage");
      const content = $("#bracketRoot .bracket");

      if(!viewer || !stage || !content) return;

      const oldTransform = stage.style.transform;
      stage.style.transform = "scale(1)";

      const available = Math.max(300, viewer.clientWidth - 28);
      const needed = content.scrollWidth || content.offsetWidth || 5600;
      const targetPct = Math.max(25, Math.min(250, Math.floor((available / needed) * 100)));

      stage.style.transform = oldTransform;
      setZoomPercent(targetPct, false);

      viewer.scrollLeft = 0;
      viewer.scrollTop = 0;
    }

    function focusActiveBracket(){
      const viewer = $("#viewer");
      const stage = $("#zoomStage");

      if(!viewer || !stage) return;

      const readyMatches = Array.from(document.querySelectorAll(".match.ready"));
      const completeMatches = Array.from(document.querySelectorAll(".match.complete"));
      const anyMatches = Array.from(document.querySelectorAll(".match"));

      const target =
        readyMatches[0] ||
        completeMatches[completeMatches.length - 1] ||
        anyMatches[0];

      if(!target) return;

      const currentZoom = liveZoom || 1;
      const targetRect = target.getBoundingClientRect();
      const viewerRect = viewer.getBoundingClientRect();

      const targetCenterX =
        (viewer.scrollLeft + (targetRect.left - viewerRect.left) + targetRect.width / 2) / currentZoom;

      const targetCenterY =
        (viewer.scrollTop + (targetRect.top - viewerRect.top) + targetRect.height / 2) / currentZoom;

      const targetZoomPct = window.innerWidth >= 1500 ? 135 : window.innerWidth >= 1000 ? 125 : 105;

      shouldAutoFocus = true;
      setZoomPercent(targetZoomPct, false);

      requestAnimationFrame(() => {
        viewer.scrollLeft = Math.max(0, targetCenterX * liveZoom - viewer.clientWidth / 2);
        viewer.scrollTop = Math.max(0, targetCenterY * liveZoom - viewer.clientHeight / 2);
      });
    }

    function wireViewer(){
      const viewer = $("#viewer");

      if(!viewer) return;

      viewer.addEventListener("wheel", e => {
        if(e.shiftKey && Math.abs(e.deltaY) > Math.abs(e.deltaX)){
          shouldAutoFocus = false;
          viewer.scrollLeft += e.deltaY;
          e.preventDefault();
        }

        if(e.ctrlKey || e.metaKey){
          e.preventDefault();
          shouldAutoFocus = false;

          if(e.deltaY < 0){
            setZoomPercent((liveZoom * 100) + 10);
          }else{
            setZoomPercent((liveZoom * 100) - 10);
          }
        }
      }, { passive:false });

      viewer.addEventListener("scroll", () => {
        if(viewer.dataset.programScroll === "1") return;
      });
    }

    function applySavedTheme(){
      const a = localStorage.getItem("ahss_theme_teamA");
      const b = localStorage.getItem("ahss_theme_teamB");
      const logo = localStorage.getItem("ahss_custom_logo_data");
      const img = $("#appLogo");

      if(a) document.documentElement.style.setProperty("--teamA", a);
      if(b) document.documentElement.style.setProperty("--teamB", b);
      if(logo && img) img.src = logo;
    }

    function startAutoRefresh(){
      if(refreshTimer){
        clearInterval(refreshTimer);
        refreshTimer = null;
      }

      if(!autoRefreshEnabled()){
        const info = $("#refreshInfo");
        if(info && !info.textContent.startsWith("Auto refresh off")){
          info.textContent = "Auto refresh off";
        }
        return;
      }

      refreshTimer = setInterval(() => {
        renderLiveBracket({ focusActive:!selectedPlayer });
      }, REFRESH_MS);
    }

    document.addEventListener("DOMContentLoaded", () => {
      applySavedTheme();

      const autoRefresh = $("#chkAutoRefresh");
      autoRefresh.checked = autoRefreshEnabled();
      autoRefresh.addEventListener("change", () => {
        localStorage.setItem(AUTO_REFRESH_KEY, autoRefresh.checked ? "1" : "0");
        startAutoRefresh();

        if(autoRefresh.checked){
          renderLiveBracket({ focusActive:!selectedPlayer });
        }
      });

      $("#btnRefresh").addEventListener("click", () => {
        renderLiveBracket({ focusActive:!selectedPlayer });
      });

      $("#btnZoomIn").addEventListener("click", zoomIn);
      $("#btnZoomOut").addEventListener("click", zoomOut);
      $("#btnFit").addEventListener("click", fitWidth);
      $("#btnFocusActive").addEventListener("click", focusActiveBracket);
      $("#btnClearPlayer").addEventListener("click", clearPlayerPath);

      $("#bracketRoot").addEventListener("click", event => {
        const name = event.target.closest(".name[data-player]");
        if(!name) return;
        selectPlayerPath(name.dataset.player || "");
      });

      wireViewer();
      wireConnectorRedraw();

      const savedZoom = parseInt(localStorage.getItem(ZOOM_KEY) || "100", 10);
      setZoomPercent(isFinite(savedZoom) ? savedZoom : 100, false);

      renderLiveBracket({ focusActive:!selectedPlayer });
      startAutoRefresh();
    });
  </script>
</body>
</html>
